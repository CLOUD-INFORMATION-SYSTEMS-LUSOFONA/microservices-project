---
- name: Deploy Application Stack
  hosts: web_servers
  become: yes
  vars:
    app_directory: /opt/app
    app_user: appuser
    # These can be passed via --extra-vars or environment variables
    rds_endpoint: "{{ rds_endpoint | default(lookup('env','RDS_ENDPOINT')) }}"
    db_password: "{{ db_password | default(lookup('env','DB_PASSWORD')) }}"
    sqs_queue_url: "{{ sqs_queue_url | default(lookup('env','SQS_QUEUE_URL'), wantlist=False) }}"

  tasks:

    - name: Ensure application directory exists
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Copy docker-compose (production) to remote
      copy:
        src: "{{ playbook_dir }}/docker-compose.yml"
        dest: "{{ app_directory }}/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'

    - name: Create .env file with runtime variables
      copy:
        dest: "{{ app_directory }}/.env"
        content: |
          RDS_ENDPOINT={{ rds_endpoint }}
          DB_PASSWORD={{ db_password }}
          {% if sqs_queue_url %}SQS_QUEUE_URL={{ sqs_queue_url }}{% endif %}
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0600'

    - name: Pull latest Docker images
      command: docker compose -f "{{ app_directory }}/docker-compose.yml" pull
      args:
        chdir: "{{ app_directory }}"
      environment:
        RDS_ENDPOINT: "{{ rds_endpoint }}"
        DB_PASSWORD: "{{ db_password }}"
        SQS_QUEUE_URL: "{{ sqs_queue_url | default('') }}"

    - name: Deploy stack with docker compose (zero-downtime friendly)
      command: docker compose -f "{{ app_directory }}/docker-compose.yml" up -d --pull always --remove-orphans
      args:
        chdir: "{{ app_directory }}"
      environment:
        RDS_ENDPOINT: "{{ rds_endpoint }}"
        DB_PASSWORD: "{{ db_password }}"
        SQS_QUEUE_URL: "{{ sqs_queue_url | default('') }}"

    - name: Wait for services to stabilize
      pause:
        seconds: 15

    - name: Check API Gateway health endpoint
      uri:
        url: http://localhost:8080/actuator/health
        method: GET
        status_code: 200
      register: api_health
      retries: 10
      delay: 5
      until: api_health.status == 200
      ignore_errors: yes

    - name: Get container status
      command: docker compose -f "{{ app_directory }}/docker-compose.yml" ps
      args:
        chdir: "{{ app_directory }}"
      register: container_status
      changed_when: false

    - name: Display deployment summary
      debug:
        msg: |
          ========== DEPLOYMENT COMPLETE ==========
          API Gateway Health: {{ api_health.status | default('unknown') }}
          Containers:
          {{ container_status.stdout }}
          ==========================================

