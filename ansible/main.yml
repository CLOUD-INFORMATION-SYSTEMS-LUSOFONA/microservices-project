---
# Master playbook to orchestrate EC2 setup and application deployment
- name: Complete Microservices Deployment Pipeline
  hosts: localhost
  gather_facts: no

  vars:
    ansible_directory: "{{ playbook_dir }}"

  tasks:

    - name: Display deployment start
      debug:
        msg: |
          🚀 Starting Complete Microservices Deployment Pipeline
          
          Steps:
          1. Configure EC2 (Docker, users, directories)
          2. Deploy services (docker-compose)
          3. Verify health checks

    - name: Include configure-ec2 playbook
      include_tasks: configure-ec2.yml
      vars:
        play_hosts: "{{ groups['web_servers'] }}"

    - name: Include deploy-app playbook
      include_tasks: deploy-app.yml
      vars:
        play_hosts: "{{ groups['web_servers'] }}"

    - name: Display final status
      debug:
        msg: |
          ✅ Deployment Pipeline Complete!
          
          Your microservices are running on EC2:
          - api-gateway: port 8080
          - product-service: port 8082
          - user-service: port 8081
          - order-service: port 8083
          - PostgreSQL: port 5432
          
          Next steps:
          1. Test endpoints: curl http://<EC2_IP>:8080/actuator/health
          2. View logs: docker-compose logs -f
          3. For more: See docs/deployment.md

