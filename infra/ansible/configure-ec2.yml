---
- name: Configure EC2 Instances (Clean AL2023 Microservices Deploy)
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    app_user: appuser
    deploy_group: ansible-deploy
    app_directory: /opt/app
    repo_url: https://github.com/CLOUD-INFORMATION-SYSTEMS-LUSOFONA/microservices-project-a22306155.git
    service_name: product-service

  tasks:

    # -------------------------
    # SYSTEM UPDATE + PACKAGES
    # -------------------------
    - name: Update system packages
      dnf:
        name: "*"
        state: latest

    - name: Install required packages
      dnf:
        name:
          - git
          - maven
          - java-21-amazon-corretto
          - docker
        state: present

    # -------------------------
    # DOCKER
    # -------------------------
    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    # -------------------------
    # USERS & GROUPS
    # -------------------------
    - name: Create deployment group
      group:
        name: "{{ deploy_group }}"
        state: present

    - name: Create application user
      user:
        name: "{{ app_user }}"
        group: "{{ deploy_group }}"
        groups: "{{ deploy_group }}"
        append: yes
        system: yes
        shell: /bin/bash
        create_home: yes

    - name: Add ec2-user to deployment group
      user:
        name: ec2-user
        groups: "{{ deploy_group }}"
        append: yes

    - name: Add users to docker group
      user:
        name: "{{ item }}"
        groups: docker
        append: yes
      loop:
        - ec2-user
        - "{{ app_user }}"

    # -------------------------
    # CLEAN DEPLOY DIR
    # -------------------------
    - name: Remove old application directory
      file:
        path: "{{ app_directory }}"
        state: absent

    - name: Recreate application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ deploy_group }}"
        mode: "2775"

    # -------------------------
    # CLONE REPOSITORY
    # -------------------------
    - name: Clone repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_directory }}"
        version: main
        force: yes

    # -------------------------
    # BUILD APPLICATION
    # -------------------------
    - name: Build product-service (Maven)
      command: mvn clean package -DskipTests
      args:
        chdir: "{{ app_directory }}/product-service"

    # -------------------------
    # FIX PERMISSIONS
    # -------------------------
    - name: Fix ownership after build
      file:
        path: "{{ app_directory }}"
        owner: "{{ app_user }}"
        group: "{{ deploy_group }}"
        recurse: yes

    # -------------------------
    # SYSTEMD SERVICE
    # -------------------------
    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/{{ service_name }}.service
        content: |
          [Unit]
          Description=Product Service
          After=network.target

          [Service]
          User={{ app_user }}
          Group={{ deploy_group }}
          WorkingDirectory={{ app_directory }}/product-service
          ExecStart=/usr/bin/java -jar {{ app_directory }}/product-service/target/*.jar
          Restart=always
          RestartSec=10
          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target

    # -------------------------
    # START SERVICE
    # -------------------------
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable and start service
      systemd:
        name: "{{ service_name }}"
        enabled: yes
        state: started